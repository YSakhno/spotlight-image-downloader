#
# This file declares the default version catalog (for more information on Gradle's version catalogs, see
# https://docs.gradle.org/9.4.0/userguide/platforms.html).
#
# NOTE: The declarations in each of the 4 major sections are ordered alphabetically. Please maintain this sorting order
# when inserting new declarations.
#

[versions]
apacheCommonsCsv = "1.14.1"
clikt = "5.1.0"
detekt = "1.23.8"
flyway = "12.1.0"
gradleupShadow = "9.4.0"
javaLanguageCompatibility = "21"
jsoup = "1.22.1"
kotest = "6.1.7"
kotlin = "2.3.20"
kotlinter = "5.4.2"
kotlinxKover = "0.9.7"
ktlint = "1.8.0"
sqliteJdbc = "3.51.3.0"

[plugins]
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
gradleup-shadow = { id = "com.gradleup.shadow", version.ref = "gradleupShadow" }
kotest = { id = "io.kotest", version.ref = "kotest" }
kotlinter = { id = "org.jmailen.kotlinter", version.ref = "kotlinter" }
kotlinx-kover = { id = "org.jetbrains.kotlinx.kover", version.ref = "kotlinxKover" }

[libraries]
apache-commons-csv = { module = "org.apache.commons:commons-csv", version.ref = "apacheCommonsCsv" }
clikt = { module = "com.github.ajalt.clikt:clikt", version.ref = "clikt" }
flyway-core = { module = "org.flywaydb:flyway-core", version.ref = "flyway" }
jsoup = { module = "org.jsoup:jsoup", version.ref = "jsoup" }
kotest-extensions = { module = "io.kotest:kotest-extensions", version.ref = "kotest" }
kotest-property = { module = "io.kotest:kotest-property", version.ref = "kotest" }
kotest-runner = { module = "io.kotest:kotest-runner-junit5", version.ref = "kotest" }
sqlite-jdbc = { module = "org.xerial:sqlite-jdbc", version.ref = "sqliteJdbc" }

[bundles]
kotest = [ "kotest-extensions", "kotest-property" ]
