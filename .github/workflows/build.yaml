name: Build

on:
  push:

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      # This tells Gradle not to output a welcome message when it is started
      GRADLE_OPTS: -Dorg.gradle.internal.launcher.welcomeMessageEnabled=false

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up JDK 21
        env:
          SEGMENT_DOWNLOAD_TIMEOUT_MINS: 1
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: 21
          java-package: jdk
          cache: gradle

      - name: Report Versions
        run: |
          # Output versions of OS, JDK/JVM, and Gradle
          echo "------------------------------------------------------------"
          echo "Ubuntu Linux"
          echo "------------------------------------------------------------"
          echo
          uname -a
          lsb_release -a
          echo
          echo "------------------------------------------------------------"
          echo "Open JDK"
          echo "------------------------------------------------------------"
          echo
          java -version
          # The following will also download Gradle before actually outputting its version
          ./gradlew --quiet --version

      - name: Check and Test the code
        run: ./gradlew check

      - name: Build the App
        run: ./gradlew build

      - name: Copy built App
        run: |
          mkdir --parents artifacts/app
          cp build/libs/spotlight-image-downloader-*-all.jar artifacts/app/

      - name: Upload JAR
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a #v7.0.1
        with:
          name: Spotlight-Downloader-app
          path: artifacts/app/
          compression-level: 0

      - name: Collect Reports
        if: always()
        run: |
          mkdir --parents artifacts/reports
          if [[ -d "build/reports" ]]; then
              cp --preserve=mode,ownership,timestamps --recursive build/reports/* artifacts/reports/
          fi

      - name: Upload Reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a #v7.0.1
        with:
          name: Spotlight-Downloader-reports
          path: artifacts/reports/
          compression-level: 9
